services:
  - type: web
    name: cooltalk-token-server
    runtime: python
    buildCommand: pip install -r web/requirements.txt
    startCommand: cd web && uvicorn token_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
    plan: free
